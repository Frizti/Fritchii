name: build-zen3-windows

# Windows build tuned for one PC: Ryzen 9 5900X (Zen 3) + Radeon RX 9070 XT.
# Same MinGW clang + eglantine.profdata PGO build as release-binaries.yml, plus
# -march=znver3 -mtune=znver3 and optional ThinLTO. Output is a workflow artifact.

on:
  workflow_dispatch:
    inputs:
      lto:
        description: Enable ThinLTO (slower build, a bit faster binary)
        type: boolean
        default: true
  push:
    branches:
      - zen3-5900x
    paths:
      - "src/**"
      - "CMakeLists.txt"
      - "CMakeModules/**"
      - "externals/**"
      - "dist/**"
      - ".patch/**"
      - "cpmfile.json"
      - ".github/workflows/build-zen3-windows.yml"

permissions:
  contents: read

concurrency:
  group: build-zen3-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: windows-x86_64-zen3-pgo
    runs-on: windows-2022
    timeout-minutes: 350
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3000M
      CCACHE_COMPILERCHECK: content
      PLATFORM: windows-x86_64-zen3-pgo
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            toolchain:p clang:p lld:p cmake:p python-pip:p
            qt6-base:p qt6-charts:p qt6-tools:p qt6-translations:p qt6-svg:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p libiconv:p
            vulkan-memory-allocator:p vulkan-devel:p glslang:p enet:p opus:p
            libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p
            lerc:p graphite2:p libwebp:p libtiff:p brotli:p ccache:p

      - name: Restore CPM downloads
        id: cpm-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/cpm
          key: cpm-${{ env.PLATFORM }}-v2-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/CPM*.cmake', 'externals/**/CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-${{ env.PLATFORM }}-v2-
            cpm-windows-x86_64-pgo-v2-
            cpm-${{ runner.os }}-

      - name: Restore compiler objects
        id: compiler-cache
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: objects-${{ env.PLATFORM }}-v2-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            objects-${{ env.PLATFORM }}-v2-${{ github.sha }}-
            objects-${{ env.PLATFORM }}-v2-

      - name: Configure
        shell: msys2 {0}
        run: |
          set -euo pipefail
          lto=ON
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ] && [ '${{ inputs.lto }}' != 'true' ]; then
            lto=OFF
          fi
          echo "ThinLTO: $lto"
          profile="-fprofile-use=$(cygpath -m "$PWD/eglantine.profdata") -Wno-backend-plugin \
            -Wno-profile-instr-unprofiled -Wno-profile-instr-out-of-date"
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_CMD=ON \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DYUZU_USE_BUNDLED_FFMPEG=ON \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DLICHII_BUILD_TAG=zen3-${{ github.run_number }} \
            -DLICHII_BUILD_PLATFORM=${{ env.PLATFORM }} \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DUSE_CCACHE=ON \
            -DYUZU_BUILD_PRESET=zen3 \
            -DENABLE_LTO=$lto \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld \
            "-DCMAKE_C_FLAGS=$profile" \
            "-DCMAKE_CXX_FLAGS=$profile"
          grep -E '^CMAKE_CXX_FLAGS|YUZU_BUILD_PRESET|ENABLE_LTO' build/release/CMakeCache.txt || true

      - name: Save CPM downloads
        if: steps.cpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/cpm
          key: ${{ steps.cpm-cache.outputs.cache-primary-key }}

      - name: Build
        shell: msys2 {0}
        run: |
          ccache --zero-stats
          cmake --build build/release --target yuzu yuzu-cmd --parallel
          ccache --show-stats

      - name: Save compiler objects
        if: always() && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Package
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:$PATH"
          cd build/release/bin
          test -f lichii.exe
          test -f eden-cli.exe
          windeployqt6 --no-translations --no-compiler-runtime --no-opengl-sw \
            --no-system-dxc-compiler --no-system-d3d-compiler lichii.exe
          deps() {
            objdump -p "$1" | awk '/DLL Name:/ {print $3}' | while read -r dll; do
              [ -z "$dll" ] && continue
              source=$(command -v "$dll" 2>/dev/null || true)
              [ -z "$source" ] && continue
              case "$source" in
                *System32* | *SysWOW64*) continue ;;
              esac
              if [ ! -f "$dll" ]; then
                cp "$source" "$dll"
                deps "$source"
              fi
            done
          }
          for exe in lichii.exe eden-cli.exe; do
            deps "$exe"
          done
          find . -name '*.dll' | while read -r dll; do
            deps "$dll"
          done

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: lichii-${{ env.PLATFORM }}-${{ github.sha }}
          path: build/release/bin/
          if-no-files-found: error
          retention-days: 30
